<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS Form Autofill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo">⚡</span>
    <h1>LOS Autofill</h1>
    <!-- Filled from the manifest at runtime, never hardcoded — a version string
         that has to be edited by hand is one that eventually lies, which is the
         whole reason it is on screen. -->
    <span id="versionTag" class="version-tag"></span>
  </header>

  <!-- Run status. Its own bar rather than the Quick Fill button's label: the
       button's job is to say what it does, and overwriting it with "Step 3…"
       hid the action, resized the control mid-run and left the last phase
       showing after the run had ended. -->
  <div id="statusBar" class="status-bar is-idle">
    <span class="status-dot"></span>
    <span id="statusText">Ready</span>
    <!-- Hidden until a run has actually produced a log, so it never offers to
         copy an empty one. The status line is a summary; this is the evidence. -->
    <button id="copyLogBtn" class="status-copy hidden" title="Salin log run terakhir">Salin log</button>
  </div>

  <!-- Simulation options. Populated by simulation-ui.js and shown ONLY on the
       credit-application create route; everywhere else Quick Fill behaves as it
       always did. Empty in markup because it is entirely data-driven. -->
  <section id="simPanel" class="sim-panel hidden"></section>

  <!-- ── Step 1: Detect ──────────────────────────────────────────────────── -->
  <section class="step-section">
    <div class="step-row">
      <div class="step-num active" id="badge1">1</div>
      <div class="step-meta">
        <span class="step-title">Detect Fields</span>
        <span class="step-sub">Scan page for all fillable fields</span>
      </div>
      <button id="detectBtn" class="btn btn-secondary btn-sm">Scan</button>
      <button id="quickFillBtn" class="btn btn-primary btn-sm">⚡ Quick Fill</button>
    </div>
    <div class="scan-opts">
      <label class="toggle-label">
        <input id="allStepsCb" type="checkbox" checked />
        All steps
      </label>
      <!-- The dialect is DETECTED per run, not chosen: it is a property of the
           page. This reports what the probe settled on. -->
      <span id="variantHint" class="hint"></span>
    </div>
    <div id="fieldsPanel" class="fields-panel hidden">
      <div class="fields-header">
        <span class="section-label">Fields <span id="fieldCount" class="hint"></span></span>
        <button id="closeFieldsBtn" class="btn-icon">✕</button>
      </div>
      <div id="fieldsList"></div>
    </div>
  </section>

  <!-- ── Step 2: Execute ───────────────────────────────────────────────────── -->
  <section class="step-section">
    <div class="step-row">
      <div class="step-num" id="badge2">2</div>
      <div class="step-meta">
        <span class="step-title">Execute</span>
        <span class="step-sub">Fill fields one by one with smart defaults</span>
      </div>
      <button id="executeBtn" class="btn btn-primary btn-sm" disabled>▶ Run</button>
    </div>
    <div class="exec-opts">
      <label class="delay-label">
        Delay <input id="delayInput" type="number" min="100" max="3000" step="100" value="200" /> ms
      </label>
      <div class="tick-row">
        <label class="toggle-label">
          <input id="skipFilledCb" type="checkbox" />
          Skip filled
        </label>
        <label class="toggle-label">
          <input id="skipOptionalCb" type="checkbox" />
          Skip optional
        </label>
        <!-- The writing half of the modal pair. Here rather than with the scan,
             because this one FILLS and SAVES records — on the v1 credit
             application it is the only setting that reaches 95 of the 179
             fields. Detect-modals was dropped; this is the only modal control. -->
        <label class="toggle-label" title="Open each record modal, FILL it and SAVE the record. This is the only setting that reaches modal fields — on the v1 credit application that is 95 fields across 8 modals.">
          <input id="fillModalCb" type="checkbox" checked />
          Fill modals
        </label>
        <!-- How the FILL answers a checkbox. Gates are always revealed during
             the scan now, so this only decides the value written. -->
        <label class="toggle-label" title="Answer checkboxes and Ya/Tidak toggles with YES when filling. Off answers No — the honest default for a blank form. Off leaves checkboxes untouched rather than answering No, so the fill cannot close the gates the scan opened.">
          <input id="tickCheckboxesCb" type="checkbox" checked />
          Tick checkboxes
        </label>
        <!-- Value RICHNESS, not field coverage — "Skip optional" owns coverage.
             Off fills the SHORTEST values that still pass validation. -->
        <label class="toggle-label" title="On fills full realistic data. Off fills the shortest values that still pass validation — exact digit counts, formats and range minimums are kept; free text and amounts shrink to their minimums.">
          <input id="completeDataCb" type="checkbox" checked />
          Complete data
        </label>
      </div>
    </div>
    <div id="progressWrap" class="hidden">
      <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
      <div id="progressLabel" class="progress-label"></div>
    </div>
    <div id="resultStrip" class="result-strip hidden"></div>
  </section>

  <!-- ── Step 3: Capture JSON ──────────────────────────────────────────────── -->
  <section class="step-section last">
    <div class="step-row">
      <div class="step-num" id="badge3">3</div>
      <div class="step-meta">
        <span class="step-title">Capture JSON</span>
        <span class="step-sub">Copy filled values as JSON</span>
      </div>
      <div class="step-btns">
        <button id="buildJsonBtn" class="btn btn-primary btn-sm" disabled>Capture &amp; Copy</button>
      </div>
    </div>
    <!-- The captured JSON goes straight to the clipboard. The 12-row preview
         that used to sit here was the tallest thing in the popup and nobody
         reads JSON in a 380px box — paste it where it is actually going.
         Kept in the DOM, hidden, because it doubles as the REPLAY input:
         parseJSON() reads it, so values pasted in are filled instead of smart
         defaults. -->
    <textarea id="jsonInput" rows="12" spellcheck="false" hidden></textarea>
  </section>

  <div class="bottom-bar">
    <span class="bottom-bar-label">On open:</span>
    <label class="toggle-label">
      <input type="radio" name="onOpen" id="onOpenQuickFill" value="quickfill" checked />
      Quick Fill
    </label>
    <label class="toggle-label">
      <input type="radio" name="onOpen" id="onOpenPopup" value="popup" />
      Open Popup
    </label>
  </div>
  <div class="app-footer">made with patience by Yusti</div>

  <div id="toast" class="toast hidden"></div>

  <!-- Drivers first: drivers.js builds its registry from their declarations,
       and popup.js dispatches through that registry. -->
  <script src="driver-v1.js"></script>
  <script src="driver-v2.js"></script>
  <script src="drivers.js"></script>
  <script src="simulation.js"></script>
  <script src="simulation-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
